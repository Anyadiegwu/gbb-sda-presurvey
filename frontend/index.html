<!doctype html>
<html lang="en">
  <head>
    <!-- Basic character encoding and responsive viewport settings. -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Metadata shown to search engines/browser tooling. -->
    <meta
      name="description"
      content="Galaxy Backbone Fibre Connectivity Cost Estimator"
    />

    <title>New Estimate — GBB Fiber Estimator</title>

    <!-- Preconnect makes the browser establish connections to Google's
         font servers before it requests the font stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- The UI uses Inter as its primary font. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- React mounts the entire application into this element. -->
    <div id="root"></div>

    <!-- Vite processes this ES module and follows its imports. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
