<script src="../js/app.js"></script>
<script src="../js/boq.js"></script>
<script>
function renderEstimates() {

  const list = getSavedEstimates();
  const container = document.getElementById('estimates-list');

  if (list.length === 0) {

    container.innerHTML = `
      <div class="card empty-state">

        <p>
          No estimates yet. Create your first estimate
          to see it here.
        </p>

        <a
          class="btn btn-primary"
          href="../index.html"
          style="margin-top:14px;display:inline-flex;">
          + New Estimate
        </a>

      </div>
    `;

    return;
  }

  container.innerHTML = list.map((e, index) => `

    <div class="card">

      <div class="estimate-list-item">

        <div>

          <h3>${e.reference}</h3>

          <p
            class="muted"
            style="margin:2px 0 0;">
            ${e.date}
          </p>

        </div>

        <span class="status-badge">
          ${e.status}
        </span>

      </div>

      <div class="review-row">
        <span>Bandwidth</span>
        <span>
          ${e.requirements.bandwidthLabel}
        </span>
      </div>

      <div class="review-row">
        <span>Fibre distance</span>
        <span>
          ${(e.location.distanceMetres / 1000).toFixed(2)} km
        </span>
      </div>

      <div class="review-row">
        <span>Total NRC</span>
        <span>
          ${formatNaira(e.calc.totalNRC)}
        </span>
      </div>

      <div class="review-row">
        <span>Total ARC</span>
        <span>
          ${formatNaira(e.calc.totalARC)}
        </span>
      </div>

      <div style="margin-top:18px;">

        <button
          class="btn btn-primary"
          onclick="downloadEstimateBOQ(${index})">
          Download BOQ Excel
        </button>

      </div>

    </div>

  `).join('');
}
renderEstimates();

function downloadEstimateBOQ(index) {

  const estimates = getSavedEstimates();
  const estimate = estimates[index];

  if (!estimate) {
    alert('Estimate could not be found.');
    return;
  }

  /*
   * Recalculate using the pricing configuration
   * that is currently stored on the device.
   */
  const draft = {
    distanceMetres:
      estimate.location.distanceMetres,

    bandwidth:
      estimate.requirements.bandwidthLabel,

    customMbps:
      estimate.requirements.bandwidthLabel
        ?.match(/Custom \(([\d.]+) Mbps\)/)?.[1] || null,

    providesOwnRack:
      estimate.requirements.providesOwnRack,

    hasGponTerminal:
      estimate.requirements.hasGponTerminal
  };

  const boq = calculateBOQ(draft);

  const rows = [];

  let serialNumber = 1;

  /*
   * One-Off section
   */
  rows.push([
    'ONE-OFF'
  ]);

  rows.push([
    'S/N',
    'Item Description',
    'QTY',
    'Rate',
    'NRC',
    'ARC'
  ]);

  boq.items
    .filter(item => item.billingType === 'one-off')
    .forEach(item => {

      rows.push([
        serialNumber++,
        item.description,
        item.quantity,
        item.rate,
        item.nrc,
        ''
      ]);

    });

  /*
   * Recurring section
   */
  rows.push([]);

  rows.push([
    'RECURRING'
  ]);

  rows.push([
    'S/N',
    'Item Description',
    'QTY',
    'Rate',
    'NRC',
    'ARC'
  ]);

  boq.items
    .filter(item => item.billingType === 'recurring')
    .forEach(item => {

      rows.push([
        serialNumber++,
        item.description,
        item.quantity,
        item.rate,
        '',
        item.arc
      ]);

    });

  /*
   * Totals
   */
  rows.push([]);

  rows.push([
    '',
    '',
    '',
    'Total NRC',
    boq.totalNRC
  ]);

  rows.push([
    '',
    '',
    '',
    'Total ARC',
    boq.totalARC
  ]);

  rows.push([
    '',
    '',
    '',
    'Grand Total',
    boq.grandTotal
  ]);

  const worksheet =
    XLSX.utils.aoa_to_sheet(rows);

  /*
   * Basic normal Excel formatting.
   */

  worksheet['!cols'] = [
    { wch: 8 },
    { wch: 42 },
    { wch: 12 },
    { wch: 18 },
    { wch: 18 },
    { wch: 18 }
  ];

  /*
   * Currency formatting.
   */
  Object.keys(worksheet).forEach(cellAddress => {

    if (cellAddress.startsWith('!')) return;

    const cell = worksheet[cellAddress];

    if (
      typeof cell.v === 'number' &&
      (
        cellAddress.startsWith('D') ||
        cellAddress.startsWith('E') ||
        cellAddress.startsWith('F')
      )
    ) {

      cell.z = '₦#,##0.00';

    }

  });

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    'BOQ'
  );

  XLSX.writeFile(
    workbook,
    `${estimate.reference}-BOQ.xlsx`
  );
}
