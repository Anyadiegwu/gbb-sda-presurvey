[project]
name = "fiber-boq-backend"
version = "0.1.0"
description = "Admin-managed BOQ generator for fiber ISP connections: customer address -> nearest POP manhole -> distance -> bandwidth -> priced BOQ"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlmodel==0.0.22",
    "psycopg[binary]==3.2.9",
    "alembic==1.13.2",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    "simpleeval==1.0.3",
    "googlemaps==4.10.0",
    "geoalchemy2==0.15.2",
    "shapely==2.0.6",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false